services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-support-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_support_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: ai-support-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ai-support-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5050
      API_PREFIX: /api/v1
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_support_agent
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: support_knowledge_base
      CONFIDENCE_THRESHOLD: 0.65
      MAX_MEMORY_MESSAGES: 12

  frontend:
    build: ./frontend
    container_name: ai-support-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  chroma_data:
